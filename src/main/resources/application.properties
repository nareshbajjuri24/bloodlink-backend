spring.application.name=bloodlink
# Secrets live in ./local.properties (git-ignored). See local.properties.example
spring.config.import=optional:file:./local.properties

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bloodlink}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# Creates/updates the tables automatically. database/schema.sql is the same layout if you prefer to run it by hand.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@bloodlink.local}}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=72
app.donor-gap-days=90

# "smtp" (Gmail, good for local) or "brevo" (HTTP API, needed on hosts that block SMTP ports such as Render free)
app.mail.provider=${MAIL_PROVIDER:smtp}
app.brevo.api-key=${BREVO_API_KEY:}
app.reset-token-minutes=30
# An admin account is created (or an existing account promoted) at startup when both are set
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
